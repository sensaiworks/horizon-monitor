[mcp]
server_path = "C:\\path\\to\\horizon-mcp\\dist\\index.js"  # absolute path to compiled MCP server
command     = "node"
# Hard per-tool-call timeout. The MCP stdio SDK waits for a response FOREVER, so a
# single lost reply wedges any caller silently -- field-tested 2026-08-24, a
# pull-payload run sat blocked for an hour mid-print with 0% CPU, no error and no log
# line. 90s means "never coming back" (a 2-monitor screenshot is normally <10s), not
# "slow". Read-only tools (screenshot/ocr/list_*) retry once; input-sending tools
# never do, since a timed-out click may already have landed.
call_timeout_seconds = 90.0

[polling]
interval_seconds  = 3
change_threshold  = 10        # imagehash Hamming distance (0=identical, 64=max)
screen_index      = 0         # 0=primary, 1=secondary — use secondary if Horizon is on monitor 2
focus_before_shot = false     # true only if Horizon won't render unless active (rare)

[windows]
monitor_titles = ["PVDI", "horizon-client"]  # partial window title matches (case-insensitive)

[capture]
# Auto-start monitoring + collecting when the app launches. When rotate=true (and
# [control].enabled), the monitor also cycles through the apps in [[capture.targets]]:
# it brings each to the front by CLICKING its taskbar button (found by OCR-matching the
# label, re-read each cycle so button drift doesn't matter), screenshots the whole VDI,
# and captures it (per-app change detection). With rotate=false it just runs the
# read-only passive monitor (no focus-stealing, no typing, no unlock).
auto_start          = false  # off by default — press Start yourself (avoids surprise API cost)
# Keep rotate=false until you've calibrated the taskbar match terms below (test one with
# `python main.py remote taskbar Symphony`). Then flip to true.
rotate              = false
settle_seconds      = 1.2   # wait after switching to an app before the screenshot
cycle_seconds       = 8     # pause between full rotations
# Rotation steals local focus, so it yields to you: the instant you touch the mouse or
# keyboard it pauses, and resumes only after you've been idle this long.
idle_resume_seconds = 90
auto_unlock         = true  # if the session is locked, unlock it (needs HORIZON_PASSWORD)
unlock_cooldown_seconds = 120  # never re-submit the password more often than this

# Apps to rotate through. `match` = substrings to look for in the taskbar button label
# (case-insensitive, first match wins). Tune these to whatever YOUR taskbar shows — e.g.
# Teams' button is often truncated to the active chat title, so match on a stable part.
# Apps not currently on the taskbar are skipped. (Scalars above MUST stay above these
# array-of-tables — TOML assigns bare keys to the last table header.)
[[capture.targets]]
name  = "Teams"
# NB: Windows OCR reads the pipe "|" as "I", so don't put "|" in match terms — the Teams
# button "Chat | PSA Azure …" OCRs as "Chat I PSA Azure …". Match the plain words instead.
match = ["Microsoft Teams", "Teams", "Chat"]

[[capture.targets]]
name  = "Outlook"
match = ["Outlook"]

[[capture.targets]]
name  = "Symphony"
match = ["Symphony"]

[webcam]
# Privacy watch: alert + log when the Horizon client opens your LOCAL webcam (i.e. the
# VDI / Teams / Webex using your camera via Real-Time Audio-Video redirection). Reads
# Windows' per-app camera-usage registry — READ-ONLY, never changes camera state.
# `match` = substrings of the using app's path; the VMware Horizon camera process is
# horizon-protocol.exe, so "horizon" catches it. Toggle/log live on the Monitor tab.
match            = ["horizon"]
interval_seconds = 5

[claude]
vision_model = "claude-haiku-4-5-20251001"
query_model  = "claude-sonnet-4-6"
max_tokens   = 1024

[rag]
db_path            = "./data/chromadb"
events_db          = "./data/events.db"   # SQLite structured store (exact/temporal queries)
collection_name    = "horizon_events"
embedding_provider = "voyage"   # "voyage" or "local"
top_k              = 8

[notifications]
enabled          = true
mention_keywords = []           # extra keywords that count as directed at user
cooldown_minutes = 5            # deduplicate window

[user]
display_name = "YourName"       # used in prompts to detect self-mentions

[retention]
# How long to keep captured conversation data. On `monitor` startup, events older
# than this are deleted from both SQLite and ChromaDB. 0 = keep everything forever.
# You can also trim/wipe manually any time: `python main.py purge [--older-than N]`.
retain_days = 0

[control]
# Master switch for WRITE actions into the remote desktop (unlock, launch/activate
# apps, send replies). These type/click into a corporate session and steal local
# focus, so they are off by default and only ever run when YOU trigger them.
enabled            = false
focus_target       = "PVDI"     # local Horizon window to focus before sending input
screen             = 0          # which monitor the remote surface is on (list_monitors index)
launch_wait_seconds = 1.5       # pause after Start-search / Enter for the remote to react
# keep-alive: `remote keep-alive` nudges the cursor 1px this often so the session never
# idles into a lock. Keep it well under the VDI's lock timeout. Steals local focus each
# tick (input needs the Horizon window foreground) — use it when you've stepped away.
keepalive_interval_seconds = 120
# Code-editing bridge (read-file/write-file): pull a file out of the remote editor,
# edit it locally, paste the whole document back. Relies on Horizon clipboard
# redirection being enabled (it usually is); read-file reports clearly if it isn't.
clipboard_sync_seconds = 0.6    # time for the clipboard to sync local <-> remote
copy_timeout_seconds   = 6.0    # give up waiting for a copied file to arrive after this
# HORIZON_PASSWORD (in .env) is used only by the unlock action.

[assist]
# Direct-help agent (Assist tab / `python main.py assist`): a screen-aware computer-use
# loop that drives the remote VDI to accomplish a goal you describe in plain language.
# ADVISE mode is read-only — it only suggests the steps. ACT mode performs them, but
# confirms every single input action (click / type / key / scroll) before it runs.
model         = "claude-opus-4-8"  # vision + reasoning model for the agent loop
# (the VDI monitor is now auto-detected from the Horizon window rect — Assist captures the
#  WHOLE VDI, even when it spans two monitors, and works in absolute coords. `screen` unused.)
max_steps     = 20                 # max actions per turn — guards against runaways
max_long_edge = 1568               # downscale screenshots to this long edge for the API
effort        = "high"             # reasoning effort ("high" is best for computer use)
focus_target  = "PVDI"             # local Horizon window to focus before sending input

[backfill]
# One-time/periodic import of a whole Teams chat's BACK-HISTORY into the knowledge
# base (the live monitor only sees the current screen). It scrolls the named chat
# newest->oldest and OCRs each frame — FREE, offline, NO Claude API — then ingests
# into the same SQLite + ChromaDB stores.  `python main.py backfill "ResiDB Support"`.
# Drives the remote (scrolls), so it needs [control].enabled = true.
screen          = 0                # VDI monitor the chat is on (list_monitors index)
pane            = [690, 115, 1210, 800]  # message-pane rect on that screen: x, y, w, h
# Adaptive scroll (src/scroller.py): it MEASURES how far the pane actually moved each
# step (by matching OCR text anchors between frames) and fires as many wheel "pulses"
# as needed to advance ~target_fraction of the pane — so each frame is mostly NEW
# content instead of re-capturing ~85% of the last one. Overshoots self-correct.
scroll_amount   = 15               # wheel notches per pulse
target_fraction = 0.8              # advance this share of the pane per frame (keeps ~0.2 overlap)
max_pulses      = 16               # cap on pulses per frame (guards a bad gain estimate)
pulse_wait_ms   = 90               # wait between pulses within one burst
settle_ms       = 650              # wait after a burst for render + lazy-load
stall_wait_ms   = 2600             # extra wait on a stall so Teams can fetch older messages
stall_limit     = 8                # near-zero-move frames in a row before we call it the top
max_frames      = 700              # safety cap on total frames
months          = 6                # stop once messages older than this many months appear

[doc_reader]
# Read a whole on-screen DOCUMENT (Word, a PDF viewer, Notepad, VS Code...) open in
# the VDI into plain text.  `python main.py read-doc`.  Unlike backfill (which uses the
# mouse wheel on a Teams chat), this PAGES with the keyboard: on this VDI the wheel
# barely moves an open document, but PageDown advances one viewport every time. It OCRs
# each viewport (FREE, offline, NO Claude API) and stitches them, stopping when a page
# stops changing (bottom reached). Drives the remote, so needs [control].enabled = true.
# Open the document and MAXIMIZE IT ALONE on its monitor first, or a PageDown can land
# on an overlapping window (a Teams chat surfacing over Word was the real failure here).
screen      = 0                    # VDI monitor the document is on (list_monitors index)
region      = [540, 185, 850, 830] # document-body rect on that screen: x, y, w, h
                                   # (excludes the Word ribbon at top and status bar at bottom)
max_pages   = 60                   # safety cap on viewports to page through
settle_ms   = 500                  # wait after Ctrl+Home before the first OCR
page_wait_ms = 450                 # wait after each PageDown for the render to settle
focus_click = true                 # click the top page margin to give the doc keyboard focus
# SAFETY: read-doc refuses to run while a Teams/Webex screen share is active, so paging a
# private document isn't broadcast to a call. It OCRs each monitor for these banners first;
# `--force` skips the check (only when you KNOW nothing is being shared).
share_flags = ["sharing your screen", "stop sharing", "you're sharing", "you're presenting"]

[mail]
# Read a whole Outlook FOLDER in the VDI structurally -- `python main.py read-mail
# "LoanCAD"` (src/outlook_reader.py). Instead of clicking each email and OCR-ing the
# reading pane, it deposits one readable PowerShell script (src/remote_scripts/
# outlook_folder_dump.ps1) and runs it with `-File`: the script attaches to the running
# Outlook via COM, walks the folder newest-first, and writes Received/From/To/Subject/
# Body to a text file, then opens it in Notepad. The local side waits for that Notepad
# window, maximizes it, and reads it back with the same keyboard-page + OCR reader as
# read-doc (clipboard copy-OUT is blocked on this VDI, so OCR is the only way back).
# FREE -- no Claude API. `--ingest` stores the messages in SQLite + ChromaDB so the Ask
# tab answers over them later. Drives the remote, so needs [control].enabled = true,
# and refuses while a screen share is active. Open a File Explorer window in the VDI
# first (every remote action types into its address bar).
folder          = "Inbox"            # default folder when none is given on the CLI
# Remote working dir for the script + dump. Must ALREADY EXIST (Notepad's Save-As can't
# create folders) and contain NO SPACES (keeps the launch command quote-free).
remote_dir      = "C:\\Temp"
max_items       = 200                # newest N messages per run
body_max_chars  = 4000               # cap each body (long threads otherwise dominate)
dump_timeout_seconds = 120.0         # give up if the dump never appears on screen
poll_seconds    = 3.0                # how often to OCR for the dump header while waiting
maximize_wait_ms = 800               # after Alt+Space, X -- let Notepad redraw maximized
# Notepad body rect on the VDI monitor once maximized (x, y, w, h) -- Notepad has no
# ribbon, so this is wider/taller than [doc_reader].region. Default fits 1920x1080.
region          = [20, 90, 1880, 950]
max_pages       = 200                # safety cap on viewports (a 200-item dump is long)
# Local copy of the read-back text lands in data/mail/<folder>_<date>.txt unless --out.

[pull]
# Pull source files out of the remote via the printer-redirection channel (src/pull.py)
# -- for VDIs that block clipboard copy-out, where controller.copy_from_remote() can't
# work at all. Prints each file from Notepad to a local PDF via a Horizon-redirected
# virtual printer, then reconstructs the source text locally (no further VDI I/O).
# Requires `pdftotext` (poppler) on PATH, and drives the remote, so also needs
# [control].enabled = true.
# RETIRED as a batch transport (see DECISIONS.md) -- reconstructing indentation from
# a printed page is a guess, and it needs one fragile print job per file. Kept only
# as a single-file, human-reviewed last resort. For a whole project, use
# `pull-payload` / [pull_payload] below instead -- it's byte-exact, verified by
# SHA-256, and needs at most a handful of print jobs regardless of file count.
# root_dir: where pulled files land, OUTSIDE this (or any) git repo -- a plain folder
# meant to be opened directly in VS Code to review/keep working on what you pulled.
# `python main.py pull ... --project PAT` groups a project under root_dir/PAT/ instead
# of dropping everything flat into root_dir. Also editable from the Settings tab.
root_dir              = "C:\\github\\Mizuho"
printer_name          = "Microsoft Print to PDF"  # substring match on the print dialog's printer name
# Where to click to focus an open Explorer window's address bar (Ctrl+L/F4 were
# field-tested live and don't reliably reach this VDI, same class of gap as Win+R).
# Screenshot the VDI once and read these off your own window if they don't match.
address_bar_x         = 1030
address_bar_y         = 295
address_bar_screen    = 0
open_wait_seconds     = 1.5   # after launching Notepad, before touching the View/Print menus
print_wait_seconds    = 0.8   # after Ctrl+P, before reading the dialog
save_wait_seconds     = 1.2   # after clicking Print, before the Save dialog is interacted with
save_poll_seconds     = 0.5   # how often to check whether the output PDF has stopped growing
save_timeout_seconds  = 20.0  # give up waiting for the PDF to land after this
# `python main.py pull-project NAME --root "C:\..."` (src/remote_tree.py): discovers
# a WHOLE remote project's file tree (robocopy /L, falling back to `dir /s`) instead
# of pulling one hand-typed path at a time, and tracks a manifest at
# root_dir/NAME/.horizon_pull_manifest.json so re-running later only pulls what's
# new/changed on the remote -- on-demand sync, nothing here runs automatically.
tree_wait_seconds     = 4.0   # after kicking off the listing command, before pulling its output
# Every pull action focuses the LOCAL Horizon window first, which can steal your
# mouse/keyboard. The moment real input is detected on this PC (Windows
# GetLastInputInfo -- same mechanism the auto-monitor rotation already uses), the
# pull pauses and waits until you've been idle again for this long before continuing.
yield_resume_seconds  = 30.0

[pull_payload]
# Byte-exact whole-project pull (src/pull_payload.py, `python main.py pull-payload
# PROJECT --root "C:\..."`) -- the pivot DECISIONS.md names to replace the old
# per-file pull above. A remote PowerShell script (src/remote_scripts/
# project_archive.ps1) zips the project, base64-encodes the zip, and writes it as one
# or a few chunked, SHA-256-verified text files; those get printed via the SAME
# print_to_pdf() as [pull] above (reused unchanged), then decoded and verified
# locally. Needs [control].enabled = true and `pdftotext` on PATH, same as [pull].
# Same root_dir/address_bar_*/open_wait_seconds/print_wait_seconds/save_wait_seconds/
# save_poll_seconds/save_timeout_seconds/printer_name/yield_resume_seconds knobs above
# are reused for the printing step -- nothing to duplicate here.
#
# VERIFIED LIVE 2026-08-18 against "Pricing Tool" with exactly the values below:
# 11 files (incl. .xlsx/.PNG binaries), 1,469,364 zip bytes -> 10 export files, ~1.9
# min per print job, ~20 min total, every hash clean. Treat these as the known-good
# baseline; change one at a time and re-measure.
#
# max_chars_per_file is THE reliability knob. Printing is the only slow, GUI-driven,
# open-loop step, so the number of print jobs (= base64 length / this value) is the
# number of chances to fail. Raising it trades more print jobs for bigger ones:
#     print jobs ~= ceil(zip_bytes * 4/3 / max_chars_per_file)
# 200000 gave 10 jobs for a 1.4 MB project; 1000000 would give 2. Untested above
# 200000 -- when calibrating, use the CLI override rather than editing this file
# (`--max-chars-per-file 500000`), and watch for a Notepad open/print that outruns
# [pull].save_timeout_seconds on the bigger file. A failed run is no longer fatal:
# re-run with --resume and only the unverified export files are reprinted.
chunk_chars             = 4000     # base64 characters per SHA-256-verified chunk
max_chars_per_file      = 200000   # split into part_002.txt, ... beyond this per file
# Any single source file over this is SKIPPED -- it is listed in the _contents.txt
# that rides back inside the zip, and the run ends with a completeness warning naming
# it, so a skip is loud rather than silent. Raise it if a real asset is being dropped.
max_file_bytes          = 5242880  # skip (and report) any single source file over 5 MB
staging_dir_name        = "_archive"  # remote dir name, sibling of the project root
manifest_poll_seconds   = 6.0    # how often to check whether the export script finished
manifest_timeout_seconds = 300.0 # give up waiting for the export script after this
# exclude_dirs = [".git", "node_modules", "__pycache__", ".venv"]  # override the
# default (same list as [pull]'s remote_tree.py discovery) if left unset.
# NB the default list includes bin/build/dist/obj/Lib/python/site-packages. If YOUR
# project has real source in a directory with one of those names it would be erased
# silently -- so the export now counts files dropped per rule and prints them at the
# end of every run ("excluded by dir rule (files): build=41"). If you see a count you
# didn't expect, set this key explicitly rather than accepting the default.

# [pricing]  — OPTIONAL. Overrides the Settings tab's cost estimate ($/1M tokens =
# [input, output]). Built-in defaults match Anthropic's published rates as of 2026-06
# (Haiku 4.5 $1/$5, Sonnet 4.6 $3/$15, Opus 4.8 $5/$25); set these only if rates change.
# "claude-haiku-4-5-20251001" = [1.0, 5.0]
# "claude-sonnet-4-6"         = [3.0, 15.0]
# "claude-opus-4-8"           = [5.0, 25.0]
